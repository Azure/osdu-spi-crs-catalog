schemaVersion: 3
service:
  name: crs-catalog
  archetype: java-maven-azure
componentGovernance:
  upstream: https://community.opengroup.org/osdu/platform/system/reference/crs-catalog-service
  ignoreDirectories: [crs-catalog_acceptance_test, testing, data]
tests:
  acceptance:
    type: pytest
    path: crs-catalog_acceptance_test
    requirements: [requirements.txt, v2/requirements.txt]
    pytestArguments: [test_crs_catalog_v2.py, test_crs_catalog_v3.py]
    timeoutMinutes: 20
    bindings:
      VIRTUAL_SERVICE_HOST_NAME: { source: gatewayHost }
      MY_TENANT: { source: partition }
      ENTITLEMENTS_DOMAIN: { source: domain }
      PRIVILEGED_USER_TOKEN: { source: token }
